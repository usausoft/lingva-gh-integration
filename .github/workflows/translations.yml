name: Translation validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lingva_request_id:
        description: Synthetic Lingva operation correlation ID (64 hex characters)
        required: true
        type: string
      lingva_project_id:
        description: Synthetic test project ID
        required: true
        type: string
      lingva_environment_id:
        description: Synthetic test environment ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: translations-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate dispatch correlation
        if: github.event_name == 'workflow_dispatch'
        env:
          LINGVA_REQUEST_ID: ${{ inputs.lingva_request_id }}
          LINGVA_PROJECT_ID: ${{ inputs.lingva_project_id }}
          LINGVA_ENVIRONMENT_ID: ${{ inputs.lingva_environment_id }}
        run: node scripts/validate-dispatch.mjs
      - run: node scripts/validate-translations.mjs
